  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light dark;
      --p: #6750A4;
      --op: #fff;
      --pc: #EADDFF;
      --opc: #21005D;
      --sc: #E8DEF8;
      --osc: #1D192B;
      --tc: #FFD8E4;
      --otc: #31111D;
      --s: #FEF7FF;
      --os: #1D1B20;
      --osv: #49454F;
      --c0: #fff;
      --c1: #F7F2FA;
      --c2: #F3EDF7;
      --c3: #ECE6F0;
      --c4: #E6E0E9;
      --ol: #79747E;
      --olv: #CAC4D0;
      --mut: var(--osv);
      --ink: var(--os)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --p: #D0BCFF;
        --op: #381E72;
        --pc: #4F378B;
        --opc: #EADDFF;
        --sc: #4A4458;
        --osc: #E8DEF8;
        --tc: #633B48;
        --otc: #FFD8E4;
        --s: #141218;
        --os: #E6E0E9;
        --osv: #CAC4D0;
        --c0: #0F0D13;
        --c1: #1D1B20;
        --c2: #211F26;
        --c3: #2B2930;
        --c4: #36343B;
        --ol: #938F99;
        --olv: #49454F
      }
    }

    :root[data-theme="dark"] {
      --p: #D0BCFF;
      --op: #381E72;
      --pc: #4F378B;
      --opc: #EADDFF;
      --sc: #4A4458;
      --osc: #E8DEF8;
      --tc: #633B48;
      --otc: #FFD8E4;
      --s: #141218;
      --os: #E6E0E9;
      --osv: #CAC4D0;
      --c0: #0F0D13;
      --c1: #1D1B20;
      --c2: #211F26;
      --c3: #2B2930;
      --c4: #36343B;
      --ol: #938F99;
      --olv: #49454F
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%
    }

    *,
    *:before,
    *:after {
      box-sizing: inherit
    }
  * {
  -webkit-tap-highlight-color: transparent;
         -webkit-user-select: none; /* Safari */
  -moz-user-select: none;    /* Firefox */
  -ms-user-select: none;     /* Internet Explorer/Edge */
  user-select: none;  
}
    body {
      margin: 0;
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      overflow-x: hidden;
      background: var(--s);
      color: var(--os);
      font: 400 14px/20px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      letter-spacing: .25px
    }

    .wrap {
      max-width: 1400px;
      margin: auto
    }

    .i {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex: none
    }

    header {
      padding: 8px 16px 4px
    }

    .top {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      flex-wrap: wrap
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--pc);
      color: var(--opc);
      display: grid;
      place-items: center
    }

    h1 {
      font: 400 22px/28px Roboto, "Noto Sans Gujarati", sans-serif;
      margin: 0;
      letter-spacing: 0
    }

    .sub {
      font-size: 12px;
      line-height: 16px;
      color: var(--osv);
      letter-spacing: .4px
    }

    .tools {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .lang {
      display: flex;
      border: 1px solid var(--ol);
      border-radius: 20px;
      overflow: hidden;
      height: 40px
    }

    .lang button {
      border: 0;
      background: none;
      color: var(--os);
      padding: 0 16px;
      font: 500 14px/20px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background .2s cubic-bezier(.2, 0, 0, 1)
    }

    .lang button+button {
      border-left: 1px solid var(--ol)
    }

    .lang button.on {
      background: var(--sc);
      color: var(--osc)
    }

    .lang button.on:before {
      content: "✓"
    }

    .lang button:hover {
      background: color-mix(in srgb, var(--os) 8%, transparent)
    }

    .lang button.on:hover {
      background: color-mix(in srgb, var(--sc), var(--os) 8%)
    }

    #th {
      border: 0;
      background: none;
      color: var(--osv);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center
    }

    #th:hover {
      background: color-mix(in srgb, var(--os) 8%, transparent)
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 8px 0 12px
    }

    .stat {
      background: var(--c4);
      border-radius: 12px;
      padding: 12px 16px
    }

    .stat b {
      display: block;
      font: 400 28px/36px Roboto, "Noto Sans Gujarati", sans-serif;
      letter-spacing: 0;
      color: var(--p)
    }

    .stat span {
      font: 500 12px/16px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      color: var(--osv);
      letter-spacing: .5px
    }

    main {
      padding: 8px 16px 16px;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 0 24px;
      align-items: start
    }

    main>.panel {
      grid-column: 1;
      grid-row: 1/span 4;
      position: sticky;
      top: 12px;
      max-height: calc(100vh - 24px);
      overflow: auto
    }

    .bar,
    .cards,
    #mw {
      grid-column: 2
    }

    .panel {
      background: var(--c1);
      border-radius: 28px;
      padding: 16px
    }

    .sw {
      position: relative
    }

    .sw .i {
      position: absolute;
      left: 16px;
      top: 16px;
      color: var(--osv)
    }

    .search {
      width: 100%;
      height: 56px;
      padding: 0 16px 0 52px;
      font: 400 16px/24px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      border: 0;
      border-radius: 28px;
      background: var(--c3);
      color: var(--os);
      letter-spacing: .5px
    }

    .search::placeholder {
      color: var(--osv)
    }

    .search:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--p);
      outline-offset: 0
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 10px;
      margin-top: 24px
    }

    .grid>div {
      position: relative
    }

    .grid label {
      position: absolute;
      top: -8px;
      left: 10px;
      background: var(--c1);
      padding: 0 4px;
      font: 400 12px/16px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      color: var(--osv);
      z-index: 1;
      margin: 0
    }

    .grid label[style] {
      position: static;
      background: none;
      font-size: 14px;
      color: var(--os) !important
    }

    select,
    input[type=number] {
      width: 100%;
      height: 48px;
      padding: 0 10px;
      font: 400 16px/24px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      border: 1px solid var(--ol);
      border-radius: 4px;
      background: transparent;
      color: var(--os)
    }

    select option {
      background: var(--c2);
      color: var(--os)
    }

    select:hover,
    input[type=number]:hover {
      border-color: var(--os)
    }

    input[type=checkbox] {
      accent-color: var(--p);
      width: 18px;
      height: 18px
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px
    }

    .chip {
      border: 1px solid var(--ol);
      background: none;
      color: var(--osv);
      border-radius: 8px;
      height: 32px;
      padding: 7px 12px;
      font: 500 14px/20px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      letter-spacing: .1px;
      cursor: pointer;
      transition: background .2s cubic-bezier(.2, 0, 0, 1)
    }

    .chip:hover {
      background: color-mix(in srgb, var(--osv) 8%, transparent)
    }

    .chip.on {
      background: var(--sc);
      color: var(--osc);
      border-color: transparent
    }

    .chip.on:before {
      content: "✓ "
    }

    .chip.q {
      background: var(--c3);
      border-color: transparent;
      color: var(--os)
    }

    .chip.q.on {
      background: var(--sc)
    }

    .btn {
      border: 1px solid var(--ol);
      background: none;
      color: var(--p);
      border-radius: 20px;
      height: 40px;
      padding: 0 24px;
      font: 500 14px/20px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      letter-spacing: .1px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s cubic-bezier(.2, 0, 0, 1)
    }

    .btn:hover {
      background: color-mix(in srgb, var(--p) 8%, transparent)
    }

    .btn.p {
      background: var(--p);
      color: var(--op);
      border-color: transparent
    }

    .btn.p:hover {
      background: color-mix(in srgb, var(--p), var(--op) 8%)
    }

    #ftg {
      display: none;
      width: 100%;
      margin-top: 12px;
      background: var(--sc);
      color: var(--osc);
      border-color: transparent
    }

    #note {
      font-size: 12px;
      color: var(--osv)
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
      flex-wrap: wrap
    }

    #cnt {
      font: 400 24px/32px Roboto, "Noto Sans Gujarati", sans-serif;
      letter-spacing: 0
    }

    .bar select {
      width: auto;
      height: 40px;
      border-radius: 20px;
      padding: 0 12px
    }

    .bar label {
      font-size: 12px;
      color: var(--osv)
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
      gap: 12px
    }

    .card {
      background: var(--c0);
      border: 1px solid var(--olv);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 16px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: box-shadow .2s cubic-bezier(.2, 0, 0, 1)
    }

    .card:after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--os);
      opacity: 0;
      transition: opacity .2s cubic-bezier(.2, 0, 0, 1);
      pointer-events: none
    }

    .card:hover {
      box-shadow: 0 1px 3px 1px rgba(0, 0, 0, .15), 0 1px 2px rgba(0, 0, 0, .3)
    }

    .card:hover:after {
      opacity: .08
    }

    .card:active:after {
      opacity: .12
    }

    .av {
      flex: 0 0 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 500 16px/24px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      background: var(--c4);
      color: var(--osv)
    }

    .card.M .av {
      background: var(--pc);
      color: var(--opc)
    }

    .card.F .av {
      background: var(--tc);
      color: var(--otc)
    }

    .cb {
      min-width: 0;
      flex: 1
    }

    .nm {
      font: 500 16px/24px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      letter-spacing: .15px;
      overflow-wrap: anywhere;
      padding-right: 56px
    }

    .meta {
      font-size: 12px;
      line-height: 16px;
      color: var(--osv);
      letter-spacing: .4px;
      margin-top: 2px
    }

    .age {
      position: absolute;
      right: 16px;
      top: 12px;
      text-align: right
    }

    .age b {
      display: block;
      font: 400 28px/36px Roboto, "Noto Sans Gujarati", sans-serif;
      letter-spacing: 0;
      color: var(--p)
    }

    .age small {
      font-size: 11px;
      color: var(--osv);
      letter-spacing: .5px
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px
    }

    .tag {
      font: 500 12px/16px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      letter-spacing: .5px;
      border: 1px solid var(--olv);
      color: var(--osv);
      padding: 5px 10px;
      border-radius: 8px
    }

    .tag.v {
      background: var(--sc);
      color: var(--osc);
      border-color: transparent
    }

    dialog {
      border: 0;
      border-radius: 28px;
      max-width: 560px;
      width: calc(100% - 24px);
      padding: 0;
      background: var(--c3);
      color: var(--os);
      box-shadow: 0 4px 8px 3px rgba(0, 0, 0, .15), 0 1px 3px rgba(0, 0, 0, .3)
    }

    dialog[open] {
      animation: dp .3s cubic-bezier(.2, 0, 0, 1)
    }

    @keyframes dp {
      from {
        opacity: 0;
        transform: translateY(24px) scale(.96)
      }
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, .32)
    }

    .dh {
      position: relative;
      padding: 24px 24px 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start
    }

    .dh b {
      font: 400 24px/32px Roboto, "Noto Sans Gujarati", sans-serif;
      letter-spacing: 0
    }

    #dx {
      border: 0;
      padding: 0 12px
    }

    .dl {
      max-height: 60vh;
      overflow: auto;
      padding: 0 24px 16px
    }

    .mem {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 0;
      border-top: 1px solid var(--olv)
    }

    .empty {
      text-align: center;
      color: var(--osv);
      padding: 56px 16px
    }

    footer {
      text-align: center;
      color: var(--osv);
      font-size: 12px;
      line-height: 16px;
      padding: 16px 16px 32px
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        animation: none !important
      }
    }

    @media(max-width:1000px) {
      main {
        grid-template-columns: 1fr
      }

      main>.panel,
      .bar,
      .cards,
      #mw {
        grid-column: 1
      }

      main>.panel {
        grid-row: auto;
        position: static;
        max-height: none;
        margin-bottom: 16px
      }

      .grid {
        grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr))
      }
    }

    @media(max-width:700px) {
      header {
        padding: 4px 12px 0
      }

      h1 {
        font-size: 20px
      }

      .sub {
        display: none
      }

      main {
        padding: 8px 12px 12px
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 8px
      }

      .stat {
        padding: 8px 12px
      }

      .stat b {
        font-size: 24px;
        line-height: 32px
      }

      #ftg {
        display: inline-flex
      }

      #adv {
        display: none
      }

      #adv.open {
        display: block
      }

      .grid {
        grid-template-columns: 1fr 1fr
      }

      .bar {
        flex-direction: column;
        align-items: stretch
      }

      .bar .row {
        justify-content: space-between
      }

      .bar select {
        flex: 1
      }

      #vch {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 6px
      }

      #vch .chip {
        flex: 0 0 auto
      }

      dialog {
        width: 100%;
        max-width: 100%;
        margin: auto 0 0;
        border-radius: 28px 28px 0 0;
        max-height: 88vh
      }

      .dl {
        max-height: 68vh
      }

      .dh {
        padding-top: 28px
      }

      .dh:before {
        content: "";
        position: absolute;
        top: 10px;
        left: 50%;
        width: 32px;
        height: 4px;
        margin-left: -16px;
        border-radius: 2px;
        background: var(--ol);
        opacity: .4
      }
    }

    @media(max-width:380px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    /* ===== M3 Expressive ===== */
    :root {
      --sp: cubic-bezier(.34, 1.56, .64, 1)
    }

    h1,
    #cnt,
    .stat b,
    .age b,
    .dh b {
      font-weight: 500
    }

    .stat {
      border-radius: 32px 32px 32px 10px;
      padding: 16px 20px;
      transition: border-radius .5s var(--sp) !important
    }

    .stat:hover {
      border-radius: 32px 10px 32px 32px !important
    }

    .stat:nth-child(1) {
      background: var(--pc)
    }

    .stat:nth-child(1) b,
    .stat:nth-child(1) span {
      color: var(--opc)
    }

    .stat:nth-child(2) {
      background: var(--sc)
    }

    .stat:nth-child(2) b,
    .stat:nth-child(2) span {
      color: var(--osc)
    }

    .stat:nth-child(3) {
      background: var(--tc)
    }

    .stat:nth-child(3) b,
    .stat:nth-child(3) span {
      color: var(--otc)
    }

    .stat b {
      font-size: 34px;
      line-height: 40px
    }

    .panel {
      border-radius: 36px
    }

    .card {
      border-radius: 28px;
      padding: 18px;
      transition: border-radius .45s var(--sp), box-shadow .2s, transform .35s var(--sp)
    }

    .card:hover {
      transform: translateY(-3px)
    }

    .card:active {
      border-radius: 14px;
      transform: scale(.98)
    }

    .av {
      border-radius: 16px;
      flex: 0 0 48px;
      height: 48px;
      font-size: 20px;
      transition: border-radius .5s var(--sp) !important
    }

    .card:hover .av {
      border-radius: 50%
    }

    .age b {
      font-size: 34px;
      line-height: 40px
    }

    .tag {
      border-radius: 12px
    }

    .tag.v {
      border-radius: 12px 12px 12px 4px
    }

    .chip {
      border-radius: 16px;
      height: 36px;
      transition: border-radius .35s var(--sp), background .2s
    }

    .chip.on {
      border-radius: 10px
    }

    .chip:active {
      border-radius: 8px
    }

    .btn {
      height: 48px;
      border-radius: 24px;
      transition: border-radius .35s var(--sp), background .2s
    }

    .btn:active {
      border-radius: 12px
    }

    .lang {
      border-radius: 24px;
      height: 44px
    }

    .search {
      height: 60px;
      border-radius: 30px
    }

    dialog {
      border-radius: 36px
    }

    dialog[open] {
      animation: dp .5s var(--sp)
    }

    dialog::backdrop {
      background: color-mix(in srgb, var(--c1) 80%, transparent);
      backdrop-filter: blur(1px)
    }


    .stats .stat,
    .stat:hover {
      will-change: border-radius
    }

    /* ===== Monet ===== */
    #th,
    #mn {
      border: 0;
      background: none;
      color: var(--osv);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: border-radius .35s var(--sp), background .2s
    }

    #th:hover,
    #mn:hover {
      background: color-mix(in srgb, var(--os) 8%, transparent);
      border-radius: 14px
    }

    #dx,
    #mx {
      border: 0;
      padding: 0 12px
    }

    .swc {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      transition: border-radius .4s var(--sp), transform .2s
    }

    .swc:hover {
      border-radius: 16px
    }

    .swc.on {
      border-radius: 16px;
      outline: 3px solid var(--p);
      outline-offset: 3px
    }

    #mc {
      width: 48px;
      height: 48px;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      border-radius: 50%
    }

    .mrow {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 20px
    }

    /* ===== Expressive motion pack ===== */
    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(28px) scale(.86)
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(32px) scale(.9)
      }
    }

    @keyframes slide {
      from {
        opacity: 0;
        transform: translateX(-18px)
      }
    }

    @keyframes chk {
      from {
        transform: scale(0) rotate(-120deg)
      }
    }

    @keyframes rip {
      to {
        transform: scale(1);
        opacity: 0
      }
    }

    @keyframes bump {
      40% {
        transform: scale(1.12)
      }
    }

    @keyframes logoIn {
      from {
        transform: scale(0) rotate(-180deg);
        border-radius: 50%
      }

      60% {
        border-radius: 10px
      }
    }

    .card.pop {
      animation: pop .65s var(--sp) backwards;
      animation-delay: calc(var(--d, 0)*38ms)
    }

    .stat {
      animation: rise .7s var(--sp) backwards
    }

    .stat:nth-child(2) {
      animation-delay: .08s
    }

    .stat:nth-child(3) {
      animation-delay: .16s
    }

    .stat:nth-child(4) {
      animation-delay: .24s
    }

    .logo {
      animation: logoIn .9s var(--sp) backwards;
      transition: border-radius .4s var(--sp)
    }

    .logo:hover {
      border-radius: 12px
    }

    .brand h1 {
      animation: slide .7s var(--sp) .15s backwards
    }

    #cnt {
      display: inline-block;
      transform-origin: left
    }

    #cnt.bump {
      animation: bump .45s var(--sp)
    }

    .chip,
    .btn,
    .lang button,
    #th,
    #mn,
    .swc {
      position: relative;
      overflow: hidden
    }

    .chip.on:before {
      display: inline-block;
      animation: chk .45s var(--sp)
    }

    .age b {
      transition: transform .45s var(--sp);
      transform-origin: right center
    }

    .card:hover .age b {
      transform: scale(1.14)
    }

    .mem {
      animation: slide .5s var(--sp) backwards;
      animation-delay: calc(var(--j, 0)*45ms)
    }

    .swc {
      animation: pop .5s var(--sp) backwards
    }

    .swc:nth-child(2) {
      animation-delay: .04s
    }

    .swc:nth-child(3) {
      animation-delay: .08s
    }

    .swc:nth-child(4) {
      animation-delay: .12s
    }

    .swc:nth-child(5) {
      animation-delay: .16s
    }

    .swc:nth-child(6) {
      animation-delay: .2s
    }

    .swc:nth-child(7) {
      animation-delay: .24s
    }

    .swc:nth-child(8) {
      animation-delay: .28s
    }

    .swc:nth-child(9) {
      animation-delay: .32s
    }

    .rp {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: .2;
      transform: scale(0);
      animation: rip .65s cubic-bezier(.2, 0, 0, 1) forwards;
      pointer-events: none
    }

    body,
    .panel,
    .stat,
    .tag,
    .search,
    dialog,
    .av {
      transition: background-color .5s, color .5s, border-color .5s
    }

    .card {
      transition: border-radius .45s var(--sp), box-shadow .2s, transform .35s var(--sp), background-color .5s, border-color .5s
    }

    .chip {
      transition: border-radius .35s var(--sp), background-color .3s, border-color .5s, color .5s
    }

    #up {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 50%;
      background: var(--pc);
      color: var(--opc);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
      transform: scale(0) rotate(-90deg);
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
      transition: transform .55s var(--sp), opacity .2s, border-radius .4s var(--sp)
    }

    #up .i {
      width: 28px;
      height: 28px
    }

    #up.show {
      transform: none;
      opacity: 1;
      pointer-events: auto;
      border-radius: 22px
    }

    #up.show:hover {
      border-radius: 50%
    }

    #up.show:active {
      transform: scale(.9)
    }

    /* ===== Developer FAB + dialog ===== */
    @keyframes hb {

      0%,
      100% {
        transform: scale(1)
      }

      15% {
        transform: scale(1.35)
      }

      30% {
        transform: scale(1)
      }

      45% {
        transform: scale(1.22)
      }
    }

    @keyframes fabIn {
      from {
        transform: translateY(90px) scale(.6);
        opacity: 0
      }
    }

    @keyframes morphAv {

      0%,
      100% {
        border-radius: 50%
      }

      33% {
        border-radius: 30% 70% 60% 40%/50% 40% 60% 50%
      }

      66% {
        border-radius: 60% 40% 30% 70%/40% 60% 50% 50%
      }
    }

    .hb {
      display: inline-block;
      color: #e11d48;
      animation: hb 1.5s ease-in-out infinite;
      margin: 0 3px
    }

    #mk {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      height: 56px;
      padding: 0 22px;
      border: 0;
      border-radius: 18px;
      background: var(--tc);
      color: var(--otc);
      display: flex;
      align-items: center;
      font: 500 14px/20px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
      cursor: pointer;
      z-index: 5;
      overflow: hidden;
      animation: fabIn .8s var(--sp) 1s backwards;
      transition: border-radius .4s var(--sp), transform .3s var(--sp)
    }

    #mk:hover {
      border-radius: 28px
    }

    #mk:active {
      transform: scale(.94);
      border-radius: 12px
    }

    .dv {
      padding: 36px 24px 24px;
      text-align: center
    }

    .dav {
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, var(--pc), var(--tc));
      color: var(--opc);
      display: grid;
      place-items: center;
      font: 500 44px/1 Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      animation: morphAv 7s ease-in-out infinite
    }

    .dmade {
      font: 500 14px/20px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      color: var(--osv);
      letter-spacing: .5px
    }

    .dname {
      font: 500 30px/38px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      font-family: inherit;
      margin: 4px 0 18px;
      letter-spacing: 0;
      overflow-wrap: anywhere
    }

    .dloc {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--sc);
      color: var(--osc);
      padding: 10px 18px;
      border-radius: 18px 18px 18px 6px;
      font-weight: 500
    }

    .dv .btn {
      display: flex;
      margin: 24px auto 0;
      min-width: 140px
    }

    footer {
      padding-bottom: 96px
    }

    .ct {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px
    }

    .ct.no {
      font-size: 12px;
      line-height: 16px;
      color: var(--osv);
      font-style: italic
    }

    .cl {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 34px;
      max-width: 100%;
      padding: 0 12px;
      border-radius: 12px;
      background: var(--sc);
      color: var(--osc);
      text-decoration: none;
      font: 500 13px/16px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      overflow-wrap: anywhere;
      transition: border-radius .35s var(--sp), background .2s
    }

    .cl:hover {
      border-radius: 17px
    }

    .cl:active {
      border-radius: 8px
    }

    .cl.w {
      background: #25d366;
      color: #053b1b
    }

    .cl.ig {
      background: linear-gradient(45deg, #f9a825, #ee2a7b 55%, #6228d7);
      color: #fff
    }

    .cl svg {
      width: 18px;
      height: 18px;
      flex: none
    }

    .dav {
      overflow: hidden
    }

    .dav img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    /* ===== About bento ===== */
    #ab {
      border: 0;
      background: none;
      color: var(--osv);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      transition: border-radius .35s var(--sp), background .2s
    }

    #ab:hover {
      background: color-mix(in srgb, var(--os) 8%, transparent);
      border-radius: 14px
    }

    .about {
      margin-top: 48px;
      scroll-margin-top: 16px;
      padding: 0 16px
    }

    .about h2 {
      font: 500 30px/38px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      margin: 0 0 16px
    }

    .bento {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: minmax(150px, auto);
      gap: 12px
    }

    .bt {
      border-radius: 32px;
      padding: 22px;
      position: relative;
      overflow: hidden;
      background: var(--c3);
      color: var(--os);
      animation: pop .7s var(--sp) backwards;
      transition: border-radius .6s var(--sp), transform .4s var(--sp)
    }

    .bt:hover {
      transform: translateY(-4px)
    }

    .bt h3 {
      font: 500 22px/28px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      margin: 0 0 8px
    }

    .bt p {
      margin: 0;
      opacity: .88
    }

    .bt h4 {
      font: 500 14px/20px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      margin: 0 0 10px;
      opacity: .85;
      letter-spacing: .4px
    }

    .bn {
      display: block;
      font: 500 58px/62px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      letter-spacing: -1px
    }

    .bl {
      font: 500 14px/20px Roboto, "Noto Sans Gujarati", system-ui, sans-serif;
      opacity: .85
    }

    .b1 {
      grid-column: span 2;
      grid-row: span 2;
      background: var(--pc);
      color: var(--opc);
      border-radius: 44px 44px 44px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px
    }

    .b1:hover {
      border-radius: 44px 12px 44px 44px
    }

    .b1 h3 {
      font-size: 30px;
      line-height: 38px
    }

    .b1 .chip {
      border-color: color-mix(in srgb, var(--opc) 35%, transparent);
      color: var(--opc);
      cursor: default
    }

    .b2 {
      background: var(--sc);
      color: var(--osc);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 32px 12px 32px 32px
    }

    .b2:hover {
      border-radius: 12px 32px 32px 32px
    }

    .b3 {
      background: var(--tc);
      color: var(--otc);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 12px 32px 32px 32px
    }

    .b3:hover {
      border-radius: 32px 12px 32px 32px
    }

    .b5,
    .b4,
    .b6 {
      grid-column: span 2
    }

    .b4 {
      border-radius: 32px 32px 12px 32px
    }

    .b6 {
      border-radius: 32px 32px 32px 12px
    }

    .b5 {
      display: flex;
      align-items: center;
      gap: 22px
    }

    .b7 {
      grid-column: span 4;
      background: linear-gradient(120deg, var(--pc), var(--tc));
      color: var(--opc);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-radius: 44px 44px 12px 44px
    }

    .dvt {
      display: flex;
      gap: 16px;
      align-items: center;
      min-width: 0
    }

    .dav.sm {
      width: 76px;
      height: 76px;
      margin: 0;
      font-size: 32px;
      flex: none
    }

    .b7 .dname {
      margin: 0;
      font-size: 26px;
      line-height: 32px
    }

    .b7 .ct {
      margin: 0
    }

    .br {
      display: grid;
      grid-template-columns: minmax(80px, 120px) 1fr 44px;
      align-items: center;
      gap: 10px;
      margin: 2px -6px;
      padding: 6px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 13px;
      transition: background .2s, border-radius .3s var(--sp)
    }

    .br:hover {
      background: color-mix(in srgb, var(--os) 8%, transparent);
      border-radius: 20px
    }

    .br span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .br em {
      font-style: normal;
      text-align: right;
      font-weight: 500
    }

    .br i {
      display: block;
      height: 14px;
      border-radius: 7px;
      background: var(--p);
      width: 0;
      transition: width 1.1s var(--sp)
    }

    .bt.in .br i {
      width: var(--w)
    }

    .dn {
      width: 130px;
      height: 130px;
      flex: none;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--p) 0 0%, var(--fc) 0 0%);
      transition: background 1s
    }

    .bt.in .dn {
      background: conic-gradient(var(--p) 0 var(--m), var(--fc) 0)
    }

    .dn:after {
      content: "";
      position: absolute;
      inset: 24px;
      border-radius: 50%;
      background: var(--c3)
    }

    .dn b {
      position: relative;
      z-index: 1;
      font: 500 20px/24px Roboto, "Noto Sans Gujarati", system-ui, sans-serif
    }

    .lg {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .lg div {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .lg i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--p)
    }

    .lg .f i {
      background: var(--fc)
    }

    .bt {
      --fc: color-mix(in srgb, var(--tc) 45%, var(--otc))
    }

    @media(max-width:1000px) {
      .bento {
        grid-template-columns: 1fr 1fr
      }

      .b1 {
        grid-row: auto
      }

      .b4,
      .b5,
      .b6,
      .b7 {
        grid-column: span 2
      }

      .b7 {
        border-radius: 36px
      }
    }

    @media(max-width:700px) {
      .about {
        margin-top: 32px;
        padding: 0 12px
      }

      .about h2 {
        font-size: 24px
      }

      .bt {
        padding: 18px;
        border-radius: 28px
      }

      .bn {
        font-size: 44px;
        line-height: 48px
      }

      .b1 h3 {
        font-size: 24px;
        line-height: 30px
      }

      .dn {
        width: 110px;
        height: 110px
      }

      .dn:after {
        inset: 20px
      }

      .br {
        grid-template-columns: minmax(70px, 100px) 1fr 40px
      }
    }
  </style>
</head>

            </svg></button>

          q = [4.0767416621 * l - 3.3077115913 * m + .2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s, -.0041960863 * l - .7034186147 * m + 1.707614701 * s];
        if (q.every(x => x >= -.0005 && x <= 1.0005)) return q.map(x => Math.round(255 * lin(cl01(x)))); C *= .94
      } const v = Math.round(255 * lin(cl01(L ** 3))); return [v, v, v]
    }
    function rgb2ok(r, g, b) {
      const f = c => { c /= 255; return c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4 }; r = f(r); g = f(g); b = f(b);
      const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b), m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b), s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b),
        A = 1.9779984951 * l - 2.428592205 * m + .4505937099 * s, B = .0259040371 * l + .7827717662 * m - .808675766 * s;
      return [.2104542553 * l + .793617785 * m - .0040720468 * s, Math.hypot(A, B), (Math.atan2(B, A) * 180 / Math.PI + 360) % 360]
    }
    const hx = q => "#" + q.map(x => x.toString(16).padStart(2, "0")).join(""), h2r = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const toneL = T => T <= 0 ? 0 : T >= 100 ? 1 : Math.cbrt(T > 8 ? ((T + 16) / 116) ** 3 : T / 903.3);
    function palette(seed, dark) {
      const [, C, h] = rgb2ok(...h2r(seed)), pc = Math.max(.1, Math.min(.16, C));
      const g = (c, hh) => T => hx(ok2rgb(toneL(T), c, hh)), P = g(pc, h), S = g(pc * .35, h), Tt = g(pc * .55, (h + 60) % 360), N = g(.012, h), V = g(.022, h);
      return dark ? { p: P(80), op: P(20), pc: P(30), opc: P(90), sc: S(30), osc: S(90), tc: Tt(30), otc: Tt(90), s: N(6), os: N(90), osv: V(80), c0: N(4), c1: N(10), c2: N(12), c3: N(17), c4: N(22), ol: V(60), olv: V(30) }
        : { p: P(40), op: P(100), pc: P(90), opc: P(10), sc: S(90), osc: S(10), tc: Tt(90), otc: Tt(10), s: N(98), os: N(10), osv: V(30), c0: N(100), c1: N(96), c2: N(94), c3: N(92), c4: N(90), ol: V(50), olv: V(80) }
    }
    function applyMonet() {
      let hex = ""; try { hex = localStorage.getItem("seed") || "" } catch (e) { }
      const d = document.documentElement, st = d.style, K = "p op pc opc sc osc tc otc s os osv c0 c1 c2 c3 c4 ol olv".split(" ");
      if (!hex) { K.forEach(k => st.removeProperty("--" + k)); return }
      const dk = d.dataset.theme ? d.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches, P = palette(hex, dk);
      K.forEach(k => st.setProperty("--" + k, P[k])); const m = document.querySelector("meta[name=theme-color]"); if (m) m.content = P.p
    }
    const SEEDS = ["#6750A4", "#1A73E8", "#00796B", "#388E3C", "#E65100", "#C2185B", "#6D4C41", "#C62828", "#546E7A"];
    function setSeed(h) { try { h ? localStorage.setItem("seed", h) : localStorage.removeItem("seed") } catch (e) { } applyMonet(); drawM() }
    function drawM() {
      let cur = ""; try { cur = (localStorage.getItem("seed") || "").toLowerCase() } catch (e) { }
      $("swr").innerHTML = SEEDS.map(s => `<button class="swc ${cur === s.toLowerCase() ? "on" : ""}" data-s="${s}" style="background:${s}" aria-label="${s}"></button>`).join(""); if (cur) $("mc").value = cur
    }
    function seedFromImage(f) {
      const im = new Image(), u = URL.createObjectURL(f); im.onload = () => {
        const c = document.createElement("canvas"); c.width = c.height = 48; const x = c.getContext("2d"); x.drawImage(im, 0, 0, 48, 48);
        const d = x.getImageData(0, 0, 48, 48).data, bin = {}; for (let i = 0; i < d.length; i += 4) { const [L, C, h] = rgb2ok(d[i], d[i + 1], d[i + 2]); if (C < .04 || L < .2 || L > .95) continue; const k = Math.round(h / 12) % 30; bin[k] = (bin[k] || 0) + C * C }
        const ks = Object.keys(bin).sort((a, b) => bin[b] - bin[a]); URL.revokeObjectURL(u); if (ks.length) setSeed(hx(ok2rgb(.55, .15, ks[0] * 12)))
      }; im.src = u
    }
    matchMedia("(prefers-color-scheme:dark)").addEventListener("change", applyMonet);
    document.addEventListener("click", e => { if (e.target.tagName === "DIALOG") e.target.close() });
    addEventListener("scroll", () => $("up").classList.toggle("show", scrollY > 500), { passive: true });
    document.addEventListener("pointerdown", e => {
      const el = e.target.closest(".btn,.chip,.card,.swc,.lang button,#th,#mn,#ab,#up,#mk,.br"); if (!el || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
      const r = el.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2, sp = document.createElement("span"); sp.className = "rp";
      sp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`; el.appendChild(sp); setTimeout(() => sp.remove(), 700)
    });
    build(); applyMonet();
  </script>
